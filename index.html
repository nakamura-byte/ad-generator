<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>広告構成ジェネレーター</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif; background: #f2f2f7; color: #1c1c1e; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 18px 32px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  header .badge { background: #6366f1; color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
  .panel-form { display: flex; flex-direction: column; gap: 16px; }
  .block-card { background: #fff; border-radius: 14px; padding: 20px 22px; border: 1.5px solid transparent; transition: border-color 0.15s; }
  .block-card:focus-within { border-color: #6366f1; }
  .card-title { font-size: 14px; font-weight: 700; color: #1c1c1e; }
  .card-desc  { font-size: 11px; color: #8e8e93; margin-top: 3px; }
  .block-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .block-num { width: 26px; height: 26px; background: #6366f1; color: #fff; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .field-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .field-row:last-child { margin-bottom: 0; }
  label { font-size: 12px; font-weight: 600; color: #48484a; }
  input[type="text"], textarea { width: 100%; border: 1.5px solid #e5e5ea; border-radius: 9px; padding: 9px 12px; font-size: 14px; font-family: inherit; color: #1c1c1e; background: #fafafa; transition: border-color 0.15s, background 0.15s; line-height: 1.55; }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: #6366f1; background: #fff; }
  textarea { resize: vertical; min-height: 72px; line-height: 1.7; }
  .ref-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .ref-pill { display: flex; align-items: center; gap: 6px; border: 1.5px solid #e5e5ea; border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer; background: #fff; color: #48484a; font-family: inherit; transition: all 0.15s; }
  .ref-pill:hover { border-color: #6366f1; color: #6366f1; }
  .ref-pill.active { background: #6366f1; border-color: #6366f1; color: #fff; }
  .ref-pill-del { opacity: 0.6; font-size: 13px; transition: opacity 0.1s; }
  .ref-pill-del:hover { opacity: 1; }
  .btn-add-ref { width: 100%; background: none; border: 1.5px dashed #c7c7cc; border-radius: 9px; padding: 7px; font-size: 12px; color: #6366f1; font-weight: 600; cursor: pointer; font-family: inherit; transition: border-color 0.15s; }
  .btn-add-ref:hover { border-color: #6366f1; }
  .template-bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .template-bar label { font-size: 12px; font-weight: 600; color: #48484a; white-space: nowrap; }
  select { flex: 1; border: 1.5px solid #e5e5ea; border-radius: 9px; padding: 8px 12px; font-size: 13px; font-family: inherit; color: #1c1c1e; background: #fff; cursor: pointer; }
  select:focus { outline: none; border-color: #6366f1; }
  .btn-reset { background: none; border: 1.5px solid #e5e5ea; border-radius: 9px; padding: 8px 14px; font-size: 12px; font-weight: 600; color: #8e8e93; cursor: pointer; white-space: nowrap; font-family: inherit; transition: border-color 0.15s, color 0.15s; }
  .btn-reset:hover { border-color: #6366f1; color: #6366f1; }
  .variant-chips { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .variant-chip { border: 1px solid #e5e5ea; border-radius: 7px; padding: 5px 10px; font-size: 11px; cursor: pointer; background: #f9f9fb; color: #48484a; font-family: inherit; text-align: left; line-height: 1.5; transition: all 0.12s; display: flex; align-items: baseline; gap: 7px; }
  .variant-chip:hover { border-color: #6366f1; color: #6366f1; background: #f0f0ff; }
  .variant-chip.vc-active { border-color: #6366f1; background: #6366f1; color: #fff; }
  .vc-label { font-weight: 700; flex-shrink: 0; opacity: 0.7; }
  .panel-preview { position: sticky; top: 78px; height: calc(100vh - 106px); display: flex; flex-direction: column; gap: 10px; }
  .preview-header { display: flex; justify-content: flex-end; flex-shrink: 0; }
  .btn-copy { background: #6366f1; color: #fff; border: none; border-radius: 10px; padding: 9px 20px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s, transform 0.1s; font-family: inherit; }
  .btn-copy:hover { background: #4f46e5; }
  .btn-copy:active { transform: scale(0.97); }
  .btn-copy.copied { background: #34c759; }
  .preview-box { background: #fff; border-radius: 14px; padding: 24px 22px; flex: 1; overflow-y: auto; font-size: 15px; line-height: 1.9; color: #1c1c1e; white-space: pre-wrap; word-break: break-all; border: 1.5px solid #e5e5ea; min-height: 0; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .panel-preview { position: static; height: auto; } }
  .header-right { margin-left:auto; display:flex; align-items:center; gap:8px; position:relative; }
  .gs-sync-time { font-size:11px; color:#8e8e93; white-space:nowrap; }
  .btn-gs { background:#34c759; color:#fff; border:none; border-radius:10px; padding:8px 16px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:6px; transition:background 0.15s,opacity 0.15s; white-space:nowrap; }
  .btn-gs:hover { background:#28a745; }
  .btn-gs:disabled { opacity:0.6; cursor:not-allowed; }
  .btn-gs-cfg { width:30px; height:30px; border-radius:8px; border:1.5px solid #e5e5ea; background:#fff; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#8e8e93; transition:all 0.15s; flex-shrink:0; }
  .btn-gs-cfg:hover { border-color:#6366f1; color:#6366f1; }
  .gs-panel { position:absolute; top:44px; right:0; background:#fff; border-radius:14px; box-shadow:0 8px 36px rgba(0,0,0,0.15); padding:18px 20px; width:380px; z-index:200; display:none; border:1.5px solid #e5e5ea; }
  .gs-panel.open { display:block; }
  .gs-panel-title { font-size:13px; font-weight:700; margin-bottom:4px; color:#1c1c1e; }
  .gs-panel-desc { font-size:11px; color:#8e8e93; margin-bottom:14px; line-height:1.6; }
  .gs-step { font-size:11px; font-weight:700; color:#6366f1; margin:10px 0 4px; }
  .gs-status { font-size:11px; padding:6px 10px; border-radius:7px; margin-top:10px; }
  .gs-status.ok { background:#e8f8ed; color:#1a8c3a; }
  .gs-status.err { background:#fff0f0; color:#c0392b; }
  .btn-metrics { width:100%; margin-top:14px; padding:10px 14px; background:#f2f2f7; border:none; border-radius:9px; font-size:12px; font-weight:700; color:#48484a; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:space-between; transition:background 0.15s; }
  .btn-metrics:hover { background:#e5e5f7; color:#6366f1; }
  .metrics-badge { font-size:11px; font-weight:600; color:#6366f1; }
  .mpage { position:fixed; inset:0; background:#f2f2f7; z-index:500; display:none; flex-direction:column; }
  .mpage-header { background:#fff; border-bottom:1.5px solid #e5e5ea; padding:14px 24px; display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .btn-mback { background:none; border:none; font-size:14px; font-weight:700; color:#6366f1; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:5px; padding:6px 12px; border-radius:8px; transition:background 0.15s; }
  .btn-mback:hover { background:#f0f0ff; }
  .mpage-title { font-size:16px; font-weight:700; flex:1; }
  .mpage-body { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px; }
  .cr-tabs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .cr-tab { padding:5px 14px; border-radius:20px; border:1.5px solid #e5e5ea; font-size:12px; font-weight:600; cursor:pointer; background:#fff; color:#48484a; font-family:inherit; transition:all 0.15s; display:inline-flex; align-items:center; gap:5px; }
  .cr-tab.active { background:#6366f1; border-color:#6366f1; color:#fff; }
  .cr-tab-del { opacity:0.5; font-size:13px; transition:opacity 0.1s; }
  .cr-tab-del:hover { opacity:1; }
  .btn-add-cr { padding:5px 12px; border-radius:20px; border:1.5px dashed #c7c7cc; font-size:12px; font-weight:600; color:#6366f1; background:none; cursor:pointer; font-family:inherit; transition:border-color 0.15s; }
  .btn-add-cr:hover { border-color:#6366f1; }
  .mpage-section { background:#fff; border-radius:14px; padding:18px 20px; }
  .msec-title { font-size:13px; font-weight:700; color:#1c1c1e; margin-bottom:12px; }
  .cr-toolbar { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .metric-toggles { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .metric-toggle { padding:5px 12px; border-radius:7px; border:1.5px solid #e5e5ea; font-size:11px; font-weight:600; cursor:pointer; background:#fff; color:#48484a; font-family:inherit; transition:all 0.15s; }
  .metric-toggle.active { background:#6366f1; border-color:#6366f1; color:#fff; }
  .chart-wrap { background:#f9f9fb; border-radius:12px; padding:14px 16px; }
  .chart-wrap canvas { display:block; width:100%; height:auto; }
  .table-wrap { overflow-x:auto; margin-top:4px; }
  .metrics-tbl { width:100%; border-collapse:collapse; font-size:12px; }
  .metrics-tbl th { background:#f2f2f7; padding:7px 8px; text-align:left; font-weight:700; white-space:nowrap; border-bottom:1.5px solid #e5e5ea; font-size:11px; }
  .metrics-tbl td { padding:2px 4px; border-bottom:1px solid #f2f2f7; }
  .metrics-tbl td input { width:100%; border:none; background:transparent; font-size:12px; font-family:inherit; color:#1c1c1e; padding:5px 6px; border-radius:4px; min-width:60px; }
  .metrics-tbl td input:focus { outline:none; background:#f0f0ff; }
  .metrics-tbl tr:hover td { background:#fafafa; }
  .tbl-del-btn { background:none; border:none; color:#c7c7cc; cursor:pointer; font-size:12px; padding:2px 8px; transition:color 0.1s; }
  .tbl-del-btn:hover { color:#ff3b30; }
  .btn-add-row { background:none; border:1.5px dashed #c7c7cc; border-radius:7px; padding:6px 16px; font-size:12px; color:#6366f1; font-weight:600; cursor:pointer; font-family:inherit; margin-top:8px; transition:border-color 0.15s; }
  .btn-add-row:hover { border-color:#6366f1; }
  .btn-csv { padding:7px 14px; border-radius:8px; border:1.5px solid #e5e5ea; font-size:12px; font-weight:600; color:#48484a; background:#fff; cursor:pointer; font-family:inherit; transition:border-color 0.15s,color 0.15s; white-space:nowrap; }
  .btn-csv:hover { border-color:#6366f1; color:#6366f1; }
  .csv-tip { font-size:11px; color:#6366f1; cursor:pointer; text-decoration:underline; white-space:nowrap; align-self:center; }
</style>
</head>
<body>

<header>
  <h1>広告構成ジェネレーター</h1>
  <span class="badge">自動生成対応</span>
  <div class="header-right">
    <span class="gs-sync-time" id="gsSyncTime"></span>
    <button class="btn-gs" id="gsBtn" onclick="syncToSheets()">⟳ スプレッドシート同期</button>
    <button class="btn-gs-cfg" onclick="toggleGsPanel()" title="設定">⚙</button>
    <div class="gs-panel" id="gsPanel">
      <div class="gs-panel-title">Googleスプレッドシート連携</div>
      <div class="gs-panel-desc">Apps ScriptのデプロイURLを貼り付けると、全データをスプレッドシートに同期できます。</div>
      <div class="gs-step">Apps Script デプロイURL</div>
      <input type="text" id="gsUrlInput" placeholder="https://script.google.com/macros/s/..." style="width:100%;margin-bottom:8px;border:1.5px solid #e5e5ea;border-radius:9px;padding:8px 10px;font-size:12px;font-family:inherit;">
      <div style="display:flex;gap:8px;">
        <button onclick="saveGsUrl()" style="flex:1;padding:8px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">保存</button>
        <button onclick="clearGsUrl()" style="padding:8px 12px;background:none;border:1.5px solid #e5e5ea;border-radius:8px;font-size:12px;color:#8e8e93;cursor:pointer;font-family:inherit;">削除</button>
      </div>
      <div id="gsStatus"></div>
    </div>
  </div>
</header>

<div class="layout">
  <div class="panel-form">
    <div class="block-card">
      <div class="card-title">ベース参考</div>
      <div class="card-desc">参考を選ぶとブロック構成が切り替わります</div>
      <div style="margin-top:14px;">
        <div class="ref-pills" id="refPills"></div>
        <button class="btn-add-ref" onclick="addRef()">＋ 参考を追加</button>
      </div>
    </div>
    <div class="block-card" id="templateCard" style="display:none;">
      <div class="card-title">ベースデータ</div>
      <div class="card-desc">施術を選択するとフィールドに一括入力されます</div>
      <div class="template-bar">
        <label>施術メニュー</label>
        <select id="templateSelect" onchange="loadTemplate(this.value)">
          <option value="">― 選択してください ―</option>
        </select>
        <button class="btn-reset" onclick="clearAll()">クリア</button>
      </div>
    </div>
    <div id="blockForm"></div>
  </div>

  <div class="panel-preview">
    <div class="preview-header">
      <button class="btn-copy" id="copyBtn" onclick="copyText()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        コピー
      </button>
    </div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

function escHtml(s) {

}

function renderForm() {
  const ref = refs[activeRefIdx];
  const config = REF_CONFIGS[ref.configKey];

  const tCard = document.getElementById('templateCard');
  const tSelect = document.getElementById('templateSelect');
  if (config.menuOptions && config.menuOptions.length > 0) {
    tCard.style.display = 'block';
    tSelect.innerHTML = '<option value="">― 選択してください ―</option>' +
      config.menuOptions.map(o => `<option value="${o.value}">${escHtml(o.label)}</option>`).join('');
    tSelect.value = ref.templateKey || '';
  } else {
    tCard.style.display = 'none';
  }

  const metricsCrs = Array.isArray(ref.metrics) ? ref.metrics : [];
  const crCount = metricsCrs.length;
  const totalRows = metricsCrs.reduce((s, cr) => s + (cr.rows||[]).length, 0);
  const metricsLabel = crCount > 0 ? `${crCount}件のCR・${totalRows}行` : 'データなし';
  const metaCard = `
    <div class="block-card">
      <div class="card-title">動画情報 &amp; 数値結果</div>
      <div class="card-desc" style="margin-bottom:14px;">動画URLと運用後の実績数値を記録します</div>
      <div class="field-row">
        <label>動画URL</label>
        <input type="text" placeholder="https://..." value="${escHtml(ref.videoUrl||'')}" oninput="onUrlInput(this.value)">
      </div>
      <button class="btn-metrics" onclick="openMetricsPage(${activeRefIdx})">
        <span>数値結果を確認 / 入力 ›</span>
        <span class="metrics-badge">${escHtml(metricsLabel)}</span>
      </button>
    </div>`;

  document.getElementById('blockForm').innerHTML = metaCard + config.blocks.map((b, bi) => {
    const vals = ref.fieldValues[bi] || {};
    const fieldsHtml = b.fields.map(f => {
      const val = escHtml(vals[f.id] || '');
      const ph  = escHtml(f.ph || '');
      const tag = f.type === 'textarea'
        ? `<textarea placeholder="${ph}" oninput="onFieldInput(${bi},'${f.id}',this.value)">${val}</textarea>`
        : `<input type="text" placeholder="${ph}" value="${val}" oninput="onFieldInput(${bi},'${f.id}',this.value)">`;
      let chips = '';
      if (bi === 0 && f.id === 'target' && ref.targetVariants && ref.targetVariants.length > 0) {
        const cur = vals[f.id] || '';
        chips = `<div class="variant-chips">` +
          ref.targetVariants.map((v, vi) =>
            `<button class="variant-chip${ v === cur ? ' vc-active' : ''}" onclick="setTargetVariant(${vi})"><span class="vc-label">${'abcdef'[vi]||vi+1}</span>${escHtml(v)}</button>`
          ).join('') +
          `</div>`;
      }
      return `<div class="field-row"><label>${escHtml(f.label)}</label>${tag}${chips}</div>`;
    }).join('');
    return `
      <div class="block-card">
        <div class="block-header">
          <div class="block-num">${bi + 1}</div>
          <div>
            <div class="card-title">${escHtml(b.title)}</div>
            <div class="card-desc">${escHtml(b.desc)}</div>
          </div>
        </div>
        ${fieldsHtml}
      </div>`;
  }).join('');
}

function setTargetVariant(variantIdx) {
  const variant = refs[activeRefIdx].targetVariants[variantIdx];
  if (variant === undefined) return;
  if (!refs[activeRefIdx].fieldValues[0]) refs[activeRefIdx].fieldValues[0] = {};
  refs[activeRefIdx].fieldValues[0].target = variant;
  renderForm();
  render();
}

function onFieldInput(bi, fid, val) {
  if (!refs[activeRefIdx].fieldValues[bi]) refs[activeRefIdx].fieldValues[bi] = {};
  refs[activeRefIdx].fieldValues[bi][fid] = val;
  render();
}

function render() {
  const ref = refs[activeRefIdx];
  const config = REF_CONFIGS[ref.configKey];
  const text = config.blocks.map((b, bi) => b.build(ref.fieldValues[bi] || {})).join('\n');
  const html = escHtml(text).replace(/＿＿＿/g, '<span style="color:#c7c7cc;">＿＿＿</span>');
  document.getElementById('preview').innerHTML = html;
}

function switchRef(i) {
  activeRefIdx = i;
  renderRefPills();
  renderForm();
  render();
}

function onUrlInput(val) {
  refs[activeRefIdx].videoUrl = val;
}

function addRef() {
  refs.push({ title: `参考${CIRCLED[refs.length] || refs.length + 1}`, configKey: 'tcb7', fieldValues: {}, templateKey: '', targetVariants: [], videoUrl: '', metrics: [] });
  activeRefIdx = refs.length - 1;
  renderRefPills();
  renderForm();
  render();
}

function deleteRef(e, i) {
  e.stopPropagation();
  if (refs.length === 1) return;
  refs.splice(i, 1);
  activeRefIdx = Math.min(activeRefIdx, refs.length - 1);
  renderRefPills();
  renderForm();
  render();
}

function loadTemplate(key) {
  if (!key) return;
  const ref = refs[activeRefIdx];
  const config = REF_CONFIGS[ref.configKey];
  const d = config.templates && config.templates[key];
  if (!d) return;
  refs[activeRefIdx].templateKey = key;
  refs[activeRefIdx].fieldValues = config.toFieldValues(d);
  refs[activeRefIdx].targetVariants = d.targetVariants || [];
  renderForm();
  render();
}

function clearAll() {
  refs[activeRefIdx].fieldValues = {};
  refs[activeRefIdx].templateKey = '';
  refs[activeRefIdx].targetVariants = [];
  renderForm();
  render();
}

function copyText() {
  const ref = refs[activeRefIdx];
  const config = REF_CONFIGS[ref.configKey];
  const text = config.blocks.map((b, bi) => {
    const v = ref.fieldValues[bi] || {};
    return b.build(v).replace(/＿＿＿/g, '');
  }).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> コピー済み`;

    }, 2000);
  });
}

function openMetricsPage(refIdx) {
  mPage.refIdx = refIdx;
  mPage.crIdx = 0;
  const ref = refs[refIdx];
  if (!Array.isArray(ref.metrics)) ref.metrics = [];
  if (!ref.metrics.length) ref.metrics.push({ name:'CR-A', rows:[] });
  document.getElementById('metricsPage').style.display = 'flex';
  renderMetricsPage();
}

function closeMetricsPage() {
  document.getElementById('metricsPage').style.display = 'none';
  mPage.refIdx = -1;
  renderForm(); render();
}

function renderMetricsPage() {
  if (mPage.refIdx < 0) return;
  const ref = refs[mPage.refIdx];
  const crs = ref.metrics || [];
  mPage.crIdx = Math.min(mPage.crIdx, Math.max(0, crs.length - 1));
  const ci = mPage.crIdx;

  document.getElementById('mPageTitle').textContent = `数値結果 — ${ref.title}`;

  // CR タブ
  document.getElementById('crTabs').innerHTML =
    crs.map((cr, i) => `
      <button class="cr-tab${i===ci?' active':''}" onclick="switchMCr(${i})">
        ${escHtml(cr.name||`CR-${i+1}`)}
        ${crs.length>1?`<span class="cr-tab-del" onclick="deleteMCr(event,${i})">×</span>`:''}
      </button>`).join('') +
    `<button class="btn-add-cr" onclick="addMCr()">＋ CRを追加</button>`;

  const cr = crs[ci];
  // ツールバー
  document.getElementById('crToolbar').innerHTML = cr ? `
    <div class="field-row" style="flex:1;min-width:150px;margin-bottom:0;">
      <label>CR名</label>
      <input type="text" value="${escHtml(cr.name||'')}" placeholder="CR-A" oninput="onMCrName(this.value)">
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end;flex-shrink:0;">
      <button class="btn-csv" onclick="document.getElementById('mCsvInput').click()">CSVから読み込む</button>
      <input type="file" id="mCsvInput" accept=".csv" style="display:none;" onchange="importMCSV(this)">
      <span class="csv-tip" onclick="downloadMCSVTemplate()">テンプレDL</span>
    </div>` : '';

  // グラフ切り替えボタン
  document.getElementById('metricToggles').innerHTML =
    `<span style="font-size:11px;font-weight:700;color:#8e8e93;align-self:center;margin-right:2px;">グラフ：</span>` +
    CHART_METRICS.map(m =>
      `<button class="metric-toggle${mPage.metric===m.id?' active':''}" onclick="setMMetric('${m.id}')">${escHtml(m.label)}</button>`
    ).join('');

  // テーブル
  if (cr) {
    const rows = cr.rows || [];
    document.getElementById('metricsTableWrap').innerHTML = `
      <table class="metrics-tbl">
        <thead><tr>
          ${TBL_COLS.map(c=>`<th style="min-width:${c.w}">${escHtml(c.label)}</th>`).join('')}
          <th></th>
        </tr></thead>
        <tbody>
          ${rows.map((row,ri)=>`
            <tr>
              ${TBL_COLS.map(c=>`<td><input type="text" value="${escHtml(row[c.id]||'')}" placeholder="${c.id==='date'?'yyyy-mm-dd':''}" oninput="onMCell(${ri},'${c.id}',this.value)"></td>`).join('')}
              <td><button class="tbl-del-btn" onclick="deleteMRow(${ri})" title="削除">✕</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <button class="btn-add-row" onclick="addMRow()">＋ 行を追加</button>`;
  } else {
    document.getElementById('metricsTableWrap').innerHTML =
      `<p style="color:#8e8e93;font-size:13px;text-align:center;padding:24px;">CRを追加してください</p>`;
  }

  setTimeout(drawMChart, 40);
}

function switchMCr(i) { mPage.crIdx = i; renderMetricsPage(); }

function addMCr() {
  const crs = refs[mPage.refIdx].metrics;
  const n = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  crs.push({ name:`CR-${n[crs.length]||crs.length+1}`, rows:[] });
  mPage.crIdx = crs.length - 1;
  renderMetricsPage();
}

function deleteMCr(e, i) {
  e.stopPropagation();
  const crs = refs[mPage.refIdx].metrics;
  if (crs.length <= 1) return;
  crs.splice(i, 1);
  mPage.crIdx = Math.min(mPage.crIdx, crs.length-1);
  renderMetricsPage();
}

function onMCrName(val) {
  const cr = refs[mPage.refIdx].metrics[mPage.crIdx];
  if (cr) cr.name = val;
  const tabs = document.querySelectorAll('.cr-tab');
  const tab = tabs[mPage.crIdx];
  if (tab) tab.childNodes[0].textContent = val || `CR-${mPage.crIdx+1}`;
}

function addMRow() {
  const cr = refs[mPage.refIdx].metrics[mPage.crIdx];
  if (!cr) return;
  if (!cr.rows) cr.rows = [];
  let nextDate = '';
  if (cr.rows.length > 0) {
    const last = cr.rows[cr.rows.length-1].date;
    if (last) { const d = new Date(last); d.setDate(d.getDate()+1); nextDate = d.toISOString().slice(0,10); }
  }
  cr.rows.push({ date:nextDate, impressions:'', views:'', clicks:'', ctr:'', cvr:'', cv:'', cpa:'', spend:'' });
  renderMetricsPage();
}

function deleteMRow(ri) {
  const cr = refs[mPage.refIdx].metrics[mPage.crIdx];
  if (!cr) return;
  cr.rows.splice(ri, 1);
  renderMetricsPage();
}

function onMCell(ri, fid, val) {
  const cr = refs[mPage.refIdx].metrics[mPage.crIdx];
  if (!cr || !cr.rows[ri]) return;
  cr.rows[ri][fid] = val;
  drawMChart();
}

function setMMetric(metric) {
  mPage.metric = metric;
  document.getElementById('metricToggles').innerHTML =
    `<span style="font-size:11px;font-weight:700;color:#8e8e93;align-self:center;margin-right:2px;">グラフ：</span>` +
    CHART_METRICS.map(m =>
      `<button class="metric-toggle${mPage.metric===m.id?' active':''}" onclick="setMMetric('${m.id}')">${escHtml(m.label)}</button>`
    ).join('');
  drawMChart();
}

function drawMChart() {
  const canvas = document.getElementById('metricsChart');
  if (!canvas || mPage.refIdx < 0) return;
  const crs = refs[mPage.refIdx].metrics || [];
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const ML=56, MR=16, MT=22, MB=38;
  const cW=W-ML-MR, cH=H-MT-MB;

  const allDates = [...new Set(crs.flatMap(cr=>(cr.rows||[]).map(r=>r.date).filter(Boolean)))].sort();
  const pv = v => { if(v===null||v===''||v===undefined) return null; const n=parseFloat(String(v).replace(/[,円%\s]/g,'')); return isNaN(n)?null:n; };
  const COLORS = ['#6366f1','#34c759','#ff9500','#ff3b30','#5856d6','#00c7be'];
  const series = crs.map((cr,ci) => ({
    name: cr.name||`CR-${ci+1}`,
    data: allDates.map(d => { const r=(cr.rows||[]).find(r=>r.date===d); return r?pv(r[mPage.metric]):null; }),
    color: COLORS[ci%COLORS.length]
  })).filter(s=>s.data.some(v=>v!==null));

  if (!allDates.length || !series.length) {
    ctx.fillStyle='#c7c7cc'; ctx.font='14px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('日付と数値を入力するとグラフが表示されます', W/2, H/2);
    return;
  }

  const allVals = series.flatMap(s=>s.data).filter(v=>v!==null);
  const yMax = Math.max(...allVals) * 1.18 || 10;

  // グリッド + Y軸ラベル
  const yT=4;
  ctx.strokeStyle='#e5e5ea'; ctx.lineWidth=1;
  for(let i=0;i<=yT;i++) {
    const y=MT+cH-(i/yT)*cH;
    ctx.beginPath(); ctx.moveTo(ML,y); ctx.lineTo(ML+cW,y); ctx.stroke();
    const v=yMax*i/yT;
    ctx.fillStyle='#8e8e93'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(v>=10000?(v/10000).toFixed(1)+'万':v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(v<10?1:0), ML-5, y);
  }

  // X軸ラベル
  const xOf = di => allDates.length>1 ? ML+(di/(allDates.length-1))*cW : ML+cW/2;
  const xs=Math.ceil(allDates.length/10);
  ctx.fillStyle='#8e8e93'; ctx.font='9px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  allDates.forEach((d,di) => { if(di%xs!==0&&di!==allDates.length-1)return; ctx.fillText(d.slice(5),xOf(di),MT+cH+6); });

  // 軸線
  ctx.strokeStyle='#c7c7cc'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(ML,MT); ctx.lineTo(ML,MT+cH); ctx.lineTo(ML+cW,MT+cH); ctx.stroke();

  // データ線 + 点
  series.forEach(s => {
    const pts = allDates.map((d,di) => { const v=s.data[di]; if(v===null)return null; return {x:xOf(di), y:MT+cH-(v/yMax)*cH}; });
    ctx.strokeStyle=s.color; ctx.lineWidth=2.5; ctx.lineJoin='round';
    ctx.beginPath(); let go=false;
    pts.forEach(pt => { if(!pt){go=false;return;} if(!go){ctx.moveTo(pt.x,pt.y);go=true;}else ctx.lineTo(pt.x,pt.y); });
    ctx.stroke();
    ctx.fillStyle=s.color;
    pts.forEach(pt => { if(!pt)return; ctx.beginPath(); ctx.arc(pt.x,pt.y,3.5,0,Math.PI*2); ctx.fill(); });
  });

  // 凡例
  ctx.textBaseline='middle';
  series.forEach((s,si) => {
    const lx=ML+si*90, ly=11;
    ctx.fillStyle=s.color; ctx.fillRect(lx,ly-2,16,3);
    ctx.fillStyle='#48484a'; ctx.font='10px sans-serif'; ctx.textAlign='left';
    ctx.fillText(s.name, lx+20, ly);
  });
}

function importMCSV(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2) return;
    const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,'').replace(/\(.*?\)/g,'').trim());
    const hmap = {
      '日付':'date','date':'date',
      'インプレッション':'impressions','インプレッション数':'impressions','imp':'impressions','impressions':'impressions','IMP':'impressions',
      '再生数':'views','views':'views','動画再生数':'views',
      'クリック':'clicks','クリック数':'clicks','clicks':'clicks',
      'ctr':'ctr','CTR':'ctr','クリック率':'ctr',
      'cvr':'cvr','CVR':'cvr','転換率':'cvr',
      'cv':'cv','CV':'cv','cv数':'cv','CV数':'cv','コンバージョン数':'cv','予約数':'cv',
      'cpa':'cpa','CPA':'cpa',
      '消化金額':'spend','費用':'spend','spend':'spend','合計費用':'spend',
    };
    const colMap = headers.map(h=>hmap[h]||null);
    const rows = lines.slice(1).map(line => {
      const cells = line.split(',').map(c=>c.trim().replace(/"/g,''));
      const row = {date:'',impressions:'',views:'',clicks:'',ctr:'',cvr:'',cv:'',cpa:'',spend:''};
      colMap.forEach((fid,ci)=>{ if(fid&&cells[ci]!==undefined) row[fid]=cells[ci]; });
      return row;
    }).filter(r=>Object.values(r).some(v=>v));
    const cr = refs[mPage.refIdx].metrics[mPage.crIdx];
    if(cr){ cr.rows=rows; renderMetricsPage(); }
    input.value='';
  };
  reader.readAsText(file,'UTF-8');
}

function downloadMCSVTemplate() {
  const headers = TBL_COLS.map(c=>c.label).join(',');
  const sample = '2025-01-01,10000,4000,120,1.2,5.0,6,3500,21000';
  const blob = new Blob([headers+'\n'+sample],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='metrics_template.csv'; a.click();
}

// === Googleスプレッドシート同期 ===
let gsUrl = '';

function toggleGsPanel() {
  const panel = document.getElementById('gsPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) {
    document.getElementById('gsUrlInput').value = gsUrl || '';
  }
}

function saveGsUrl() {
  const val = document.getElementById('gsUrlInput').value.trim();
  if(!val) { alert('URLを入力してください'); return; }
  gsUrl = val;
  localStorage.setItem('gsUrl', gsUrl);
  showGsStatus('URLを保存しました', 'ok');
}

function clearGsUrl() {
  if(!confirm('Apps Script URLを削除しますか？')) return;
  gsUrl = '';
  localStorage.removeItem('gsUrl');
  localStorage.removeItem('gsSyncTime');
  document.getElementById('gsUrlInput').value = '';
  document.getElementById('gsSyncTime').textContent = '';
  showGsStatus('URLを削除しました', 'ok');
}

function showGsStatus(msg, type) {
  const el = document.getElementById('gsStatus');
  el.className = 'gs-status ' + type;
  el.textContent = msg;
  setTimeout(() => { el.className = 'gs-status'; el.textContent = ''; }, 3000);
}

function syncToSheets() {
  if(!gsUrl) {
    document.getElementById('gsPanel').classList.add('open');
    document.getElementById('gsUrlInput').value = '';
    showGsStatus('先にApps Script URLを設定してください', 'err');
    return;
  }
  const btn = document.getElementById('gsBtn');
  btn.disabled = true;
  btn.textContent = '同期中…';
  try {
    const payload = {
      syncedAt: new Date().toLocaleString('ja-JP'),
      refs: refs.map(r => ({
        title: r.title,
        configKey: r.configKey,
        templateKey: r.templateKey,
        videoUrl: r.videoUrl,
        fieldValues: r.fieldValues,
        metrics: r.metrics,
        scriptText: (REF_CONFIGS[r.configKey]?.blocks || []).map((b,bi) => b.build(r.fieldValues[bi] || {})).join('\n')
      }))
    };
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = gsUrl;
    form.target = 'gsSyncFrame';
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
    setTimeout(() => {
      const now = new Date().toLocaleString('ja-JP');
      localStorage.setItem('gsSyncTime', now);
      document.getElementById('gsSyncTime').textContent = '最終同期: ' + now;
      document.getElementById('gsPanel').classList.remove('open');
      showGsStatus('同期しました（スプレッドシートを確認してください）', 'ok');
      btn.disabled = false;
      btn.innerHTML = '⟳ スプレッドシート同期';
    }, 2000);
  } catch(e) {
    showGsStatus('エラー: ' + e.message, 'err');
    btn.disabled = false;
    btn.innerHTML = '⟳ スプレッドシート同期';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  gsUrl = localStorage.getItem('gsUrl') || '';
  const lastSync = localStorage.getItem('gsSyncTime');
  if(lastSync) document.getElementById('gsSyncTime').textContent = '最終同期: ' + lastSync;

  document.addEventListener('click', e => {
    const panel = document.getElementById('gsPanel');
    const cfg = document.querySelector('.btn-gs-cfg');
    if(panel.classList.contains('open') && !panel.contains(e.target) && e.target !== cfg) {
      panel.classList.remove('open');
    }
  });

  renderRefPills();
  renderForm();
  render();
});
</script>
